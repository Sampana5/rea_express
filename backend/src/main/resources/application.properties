# Serveur
server.port=8080

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/rea-express?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Yannick_base

# JPA / Hibernate — crée ou met à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=rea-express_2002&secretKeyForJwtSigningMinimum256Bits!!
jwt.expiration-ms=36000000

# Robustesse / gestion des erreurs
server.error.whitelabel.enabled=false
spring.jackson.default-property-inclusion=non_null

# Uploads (fiches techniques, images produits ulterieures)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Logs
logging.level.com.rea.express=INFO

