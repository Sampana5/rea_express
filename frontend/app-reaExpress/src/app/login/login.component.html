<section id="login" class="auth-page">
  <div class="rea-container auth-wrap">
    <div class="auth-intro">
      <span class="rea-kicker">Espace client</span>
      <h1 class="rea-title">Identification client</h1>
      <p class="rea-lead">
        Connectez-vous pour suivre vos commandes, accéder à vos devis
        et commander plus rapidement.
      </p>
    </div>

    <div class="auth-panel">
      <div class="auth-panel-head">Connexion</div>
      <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <label for="loginEmail">Identifiant ou E-mail</label>
        <input id="loginEmail" type="email" formControlName="email" autocomplete="username" placeholder="ex. mon.email@clinique.bf">

        <label for="loginPass">Mot de passe</label>
        <input id="loginPass" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••">

        <p class="auth-error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit" class="rea-btn rea-btn-primary auth-submit" [disabled]="loading">
          {{ loading ? 'Connexion…' : 'Valider' }}
        </button>
      </form>

      <app-social-auth mode="login"></app-social-auth>

      <div class="auth-links">
        <a routerLink="/mot-de-passe-oublie">Vous avez oublié votre mot de passe ?</a>
        <a routerLink="/signup">Vous n'avez pas de compte ? Inscrivez-vous gratuitement.</a>
      </div>
    </div>
  </div>
</section>
