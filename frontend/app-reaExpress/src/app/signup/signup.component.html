<section id="signup" class="auth-page">
  <div class="rea-container auth-wrap">
    <div class="auth-intro">
      <span class="rea-kicker">Inscription</span>
      <h1 class="rea-title">Créer un compte client</h1>
      <p class="rea-lead">
        Inscrivez-vous pour accéder à votre espace REA Express et commander
        réactifs, consommables et équipements médicaux.
      </p>
    </div>

    <div class="auth-panel">
      <div class="auth-panel-head">Nouvel utilisateur</div>
      <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <label for="name">Nom complet</label>
        <input id="name" type="text" formControlName="name" placeholder="Votre nom">

        <label for="contactNumber">Téléphone</label>
        <input id="contactNumber" type="text" formControlName="contactNumber" placeholder="+226 …">

        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" placeholder="email@exemple.com">

        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••">

        <p class="auth-error" *ngIf="errorMessage">{{ errorMessage }}</p>
        <p class="auth-success" *ngIf="successMessage">{{ successMessage }}</p>

        <button type="submit" class="rea-btn rea-btn-primary auth-submit" [disabled]="loading">
          {{ loading ? 'Inscription…' : "S'inscrire" }}
        </button>
      </form>

      <div class="auth-links">
        <a routerLink="/login">Vous possédez déjà un compte ? Connectez-vous</a>
      </div>
    </div>
  </div>
</section>
